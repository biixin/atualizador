services:
  radar:
    build: .
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      APP_ORIGIN: https://${DOMAIN:?Defina DOMAIN no .env}
      MONITOR_TOKEN: ${MONITOR_TOKEN:?Defina MONITOR_TOKEN no .env}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
    volumes:
      - radar_data:/app/data
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Defina DOMAIN no .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - radar
volumes:
  radar_data:
  caddy_data:
  caddy_config:
